name: hallway-test
version: 0.1.0
manifest_version: 2
api_version: 1
description: >-
  Watch five simulated people try your web page, each with real limits enforced in code: a first-time
  visitor, a 72-year-old with low vision, a blind screen-reader user on keyboard only, a red-green
  colour-blind user and a user with a hand tremor. Each drives a real browser one decision at a time on your
  own model; you get who finished, who gave up and why in their own words, dead taps, prioritised fixes, a
  report with step-by-step replays and a shareable summary card. Add your own people from the same enforced
  traits. Includes a Desktop page that follows runs live and a bundled demo app.
author: lexipej
license: MIT
homepage: https://github.com/lexipej/hallway-test
tags: [usability, accessibility, a11y, testing, ux, personas, playwright, desktop]
requires_hermes: ">=0.23"
provides_tools:
  - hallway_test
provides_hooks: []
python_dependencies:
  - "playwright>=1.50,<2"
config_schema:
  max_steps: {type: int, default: 16, description: "Most actions per person per run (keyboard-only people get 1.8x)."}
  parallel: {type: int, default: 3, description: "How many browsers run at the same time (1-6). Lower it on slower machines; each one can use 300-600 MB."}
  time_budget_seconds: {type: int, default: 330, description: "Stop everyone after this long so the tool call finishes inside Hermes's tool timeout."}
